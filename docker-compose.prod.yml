version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: prod-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/lib/letsencrypt:/var/lib/letsencrypt
    depends_on:
      - backend
    networks:
      - backend-net

  redis:
    image: redis:7
    container_name: prod-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - backend-net

  backend:
    image: foureach/ctrlu-backend:latest
    container_name: backend
    restart: unless-stopped
    env_file:
      - .env.prod
    networks:
      - backend-net
    volumes:
      # 호스트의 /var/log/ctrlu-app-logs 디렉토리를 컨테이너의 /app/logs 디렉토리로 마운트
      - /var/log/ctrlu-app-logs:/app/logs

  certbot-renew:
    image: certbot/certbot
    container_name: certbot-renew
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/lib/letsencrypt:/var/lib/letsencrypt
    entrypoint: >
      sh -c "while true; do
        certbot renew --webroot -w /var/lib/letsencrypt --quiet &&
        echo '✔ Renewed! Reloading nginx...' &&
        docker exec prod-nginx nginx -s reload;
        sleep 12h;
      done"
    networks:
      - backend-net
    depends_on:
      - nginx

